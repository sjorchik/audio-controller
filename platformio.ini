; Аудіоконтролер на ESP32-S3-N16R8
; Тільки ESP-IDF, без Arduino

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
; --------------------------------------------------------------------
; Фіксація платформи.
; Не використовуйте просто "platform = espressif32", бо тоді
; PlatformIO може підтягнути новішу/іншу версію платформи.
; --------------------------------------------------------------------
platform = espressif32 @ 6.12.0

; --------------------------------------------------------------------
; Плата і фреймворк.
; Для кастомної PCB плата може лишитися esp32-s3-devkitc-1.
; Відмінності кастомної плати описуємо у components/bsp.
; --------------------------------------------------------------------
board = esp32-s3-devkitc-1
framework = espidf

; --------------------------------------------------------------------
; Flash: ESP32-S3-N16R8 має 16 MB.
; board_upload.flash_size важливий для esptool/завантажувача.
; --------------------------------------------------------------------
board_upload.flash_size = 16MB

; --------------------------------------------------------------------
; Режим і частота flash.
; QIO + 80 MHz — типовий безпечний швидкісний режим для 16 MB.
; --------------------------------------------------------------------
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; --------------------------------------------------------------------
; Octal PSRAM.
; ESP32-S3-N16R8 має 8 MB octal PSRAM.
; qio_opi означає:
;   - flash: QIO;
;   - PSRAM: OPI/Octal.
; --------------------------------------------------------------------
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; --------------------------------------------------------------------
; Таблиця розділів.
; --------------------------------------------------------------------
board_build.partitions = partitions.csv

; --------------------------------------------------------------------
; Прошивка і монітор.
; --------------------------------------------------------------------
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp_idf

; --------------------------------------------------------------------
; Прапорці компілятора.
; Рівень логування задається у sdkconfig.defaults, а не тут.
; --------------------------------------------------------------------
build_flags =
    -Wall
    -Wextra
    -DHW_VERSION=2
    -DFW_VERSION_MAJOR=0
    -DFW_VERSION_MINOR=1
    -DFW_VERSION_PATCH=0

; ────────────────────────────────────────────────────────────────
; Host-середовище для юніт-тестів чистої математики DSP та стан-машини.
; Запуск: pio test -e native
;
; ВАЖЛИВО (структура сьютів): кожна папка всередині test/ — окремий
; сьют із власною програмою (власні main/setUp/tearDown). Файли у
; КОРЕНІ test/ лінкуються в одну програму разом із кожним сьютом,
; тому там не має лишатися жодного .c із main/setUp/tearDown.
;
; -Itest: після переїзду test_dsp_math.c у test/dsp_math/ його
; відносні інклюди "../components/audio/..." резолвляться через цей
; шлях пошуку (fallback quoted-include), вміст файлу не змінюється.
; ────────────────────────────────────────────────────────────────
[env:native]
platform = native
build_flags =
    -std=gnu11
    -DUNITY_INCLUDE_DOUBLE
    -Itest
    -Icomponents/audio
    -Icomponents/audio/include
    -Icomponents/input
    -Icomponents/input/include
test_build_src = no